services:
  frontend:
    build: ./client
    ports:
      - "8080:3002"
    depends_on:
      - backend-nestjs
    volumes:
      - ./client:/app
    networks:
      - app-network

  backend-nestjs:
    build: ./server
    ports:
      - "3001:3001"
    depends_on:
      - backend-flask
      - postgres
    volumes:
      - ./server:/app
    networks:
      - app-network

  backend-flask:
    build: ./server-flask
    ports:
      - "5000:5000"
    volumes:
      - ./server-flask:/app
    networks:
      - app-network

  postgres:
    image: postgres:latest
    container_name: postgres_local_fitgpt2
    environment:
      POSTGRES_USER: fitgpt
      POSTGRES_PASSWORD: fitgpt
      POSTGRES_DB: fitgpt
    volumes:
      - ./db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
